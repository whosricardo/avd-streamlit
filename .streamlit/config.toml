# Identidade visual do dashboard: floresta, musgo e âmbar.
# O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
paddingTop = "0.5rem"
font = "sans serif"

[theme.light]
primaryColor = "#d99a16"
backgroundColor = "#fbfaf3"
secondaryBackgroundColor = "#e8f0e9"
textColor = "#17372a"
borderColor = "#b8c9bc"

[theme.dark]
primaryColor = "#f0b63a"
backgroundColor = "#10251c"
secondaryBackgroundColor = "#19382a"
textColor = "#f7f3df"
borderColor = "#436351"
